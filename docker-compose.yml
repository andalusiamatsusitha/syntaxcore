services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syntaxcore-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "${APP_NAME:-SyntaxCore}"
      APP_ENV: "${APP_ENV:-development}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "db"
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-syntaxcore}"
      DB_USERNAME: "${DB_USERNAME:-syntaxcore}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-admin@syntaxcore.com}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-admin123}"
      SEED_ADMIN_NAME: "${SEED_ADMIN_NAME:-Administrator}"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - syntaxcore-network

  web:
    image: nginx:alpine
    container_name: syntaxcore-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - syntaxcore-network

  db:
    image: mysql:8.0
    container_name: syntaxcore-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-syntaxcore}"
      MYSQL_USER: "${DB_USERNAME:-syntaxcore}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - syntaxcore-dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - syntaxcore-network

networks:
  syntaxcore-network:
    driver: bridge

volumes:
  syntaxcore-dbdata:
    driver: local
