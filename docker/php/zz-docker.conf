[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Keep environment variables available to PHP scripts
clear_env = no

; Process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Access logging
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
